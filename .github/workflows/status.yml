name: Status

# A read-only look at the server: what is running, how loaded it is and
# whether the station is healthy. Run it from the Actions tab.
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Report over SSH
        # Pinned to a commit: this action is handed the deploy key.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The server's ECDSA host key; see deploy.yml.
          fingerprint: SHA256:2xQsH1vrrsC21xbx0iNcCBniOmL3bfdixj+nq9E/u7M
          script: |
            set -eu
            cd ~/generative-station
            sh ./status.sh
