services:
  icecast:
    build: ./icecast
    container_name: gs-icecast
    ports:
      - "8000:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/icecast2/web/custom:ro

  station:
    build: ./station
    container_name: gs-station
    depends_on:
      - icecast
    environment:
      ICECAST_HOST: icecast
      ICECAST_PORT: "8000"
      ICECAST_MOUNT: /stream
      ICECAST_SOURCE_USER: source
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      JACK_SAMPLE_RATE: "48000"
      JACK_PERIOD: "4096"
    shm_size: "512m"
    restart: unless-stopped
    volumes:
      - ./station/piece.scd:/app/piece.scd:ro
      - ./station/swells.scd:/app/swells.scd:ro
      - ./station/lowplucks.scd:/app/lowplucks.scd:ro
      - ./station/plucks.scd:/app/plucks.scd:ro
      - ./station/clicks.scd:/app/clicks.scd:ro
      - ./station/sweeps.scd:/app/sweeps.scd:ro
      - ./station/bass.scd:/app/bass.scd:ro
      - ./station/percussion.scd:/app/percussion.scd:ro

  caddy:
    image: caddy:2-alpine
    container_name: gs-caddy
    environment:
      STATION_SITE: ${STATION_SITE:-station.berserkbrah.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - icecast
      - picker
    restart: unless-stopped

  picker:
    build: ./picker
    container_name: gs-picker
    environment:
      STATION_WEBHOOK_SECRET: ${STATION_WEBHOOK_SECRET}
      SC_HOST: station
      SC_PORT: "57120"
      DEBOUNCE_SECONDS: "30"
    depends_on:
      - station
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
