<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>generative-station</title>
<!-- What a link to the station shows where it is passed on: a chat, a
     post, a search result. The picture is the trace visual's figure of
     choline. These are read without the page being run, so the addresses
     are whole ones. -->
<meta name="description" content="Music that is made as it plays and does not end. Its notes come from the mass spectrum of a chemical compound, and so do the pictures drawn to it.">
<meta property="og:type" content="website">
<meta property="og:title" content="generative-station">
<meta property="og:description" content="Music that is made as it plays and does not end. Its notes come from the mass spectrum of a chemical compound, and so do the pictures drawn to it.">
<meta property="og:url" content="https://station.berserkbrah.com/">
<meta property="og:image" content="https://station.berserkbrah.com/share.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A looping line of orange, green and blue light on a dark ground: the figure the station draws of choline's mass spectrum.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
  /* The page is dark, and what the browser draws for it is to be dark too:
     its player above all, which is otherwise a white bar and the brightest
     thing on a page that is there for its picture. */
  html { background: #111; color-scheme: dark; }
  body {
    background: transparent;
    color: #ddd;
    font-family: monospace;
    padding: 1.5rem;
    margin: 0;
  }
  canvas.viz {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 1.8s ease;
    pointer-events: none;
    display: block;
  }
  h1, audio, #compound, #caption {
    position: relative;
    z-index: 1;
  }
  /* What the picture is of, under the name of what it is drawn from. */
  #compound { margin-bottom: 0.4rem; }
  #caption {
    margin: 0;
    max-width: 46rem;
    font-size: 0.8rem;
    line-height: 1.6;
    color: #8a8a8a;
    /* it lies on the picture, which is bright in places */
    text-shadow: 0 0 3px #111, 0 0 6px #111;
  }
  #caption b { color: #ccc; font-weight: normal; }
  #status {
    position: fixed;
    left: 1.5rem;
    bottom: 1.25rem;
    z-index: 1;
    font-size: 0.8rem;
    line-height: 1.75;
    color: #8a8a8a;
  }
  #status b { color: #ccc; font-weight: normal; }
  #credit {
    position: fixed;
    right: 1.5rem;
    bottom: 1.25rem;
    z-index: 1;
    font-size: 0.8rem;
    line-height: 1.75;
    color: #8a8a8a;
  }
  #credit a { color: #ccc; }
  /* On a phone the two would share a line and collide: the credit keeps
     the bottom line and the status sits just above it. */
  @media (max-width: 640px) {
    #status { bottom: calc(1.25rem + 1.4rem); }
  }
  #visits span {
    display: inline-block;
    margin-right: 1px;
    padding: 0 0.32em;
    background: #000;
    border: 1px solid #333;
    color: #e6e6e6;
  }
  #status button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-decoration: underline dotted;
  }
  #visual-part:not([hidden]) + #watch-part::before { content: ' · '; }
  /* A phone has no room for all four on one line: the two that are about
     the picture keep a line to themselves. */
  @media (max-width: 640px) {
    #visual-part:not([hidden]) { display: block; }
    #visual-part:not([hidden]) + #watch-part::before { content: none; }
  }
  /* The timer stands last, after whichever of the other two are there. */
  #visual-part:not([hidden]) ~ #sleep-part::before,
  #watch-part:not(.words-only) ~ #sleep-part::before,
  html[data-visual] #watch-part ~ #sleep-part::before { content: ' · '; }
  /* Where the words can only be hidden, not the browser with them, there
     is nothing to offer until a picture is drawn behind them. */
  html:not([data-visual]) #watch-part.words-only { display: none; }
  @media (max-width: 640px) {
    html:not([data-visual]) #watch-part.words-only ~ #sleep-part::before { content: none; }
  }
  /* A key is no use where there is no keyboard. */
  @media (hover: none) {
    .key { display: none; }
  }
  /* Fullscreen is for watching: once nothing has been touched for a few
     seconds the page's words and the pointer leave the picture, slowly, and
     the first movement, tap or key brings them back at once. Only while a
     visual is drawing, or the screen would be left empty. An iPhone, which
     has no fullscreen for a page, is watched the same way in its browser. */
  audio, #compound, #caption, #status, #credit { transition: opacity 0.25s ease; }
  html.idle[data-visual] audio,
  html.idle[data-visual] #compound,
  html.idle[data-visual] #caption,
  html.idle[data-visual] #status,
  html.idle[data-visual] #credit {
    opacity: 0;
    transition-duration: 1.5s;
  }
  html.idle[data-visual], html.idle[data-visual] * { cursor: none; }
  /* What cannot be seen cannot be pressed, and the tap that brings the
     words back does not also land on whatever is under it. */
  html.idle[data-visual] audio, html.waking[data-visual] audio,
  html.idle[data-visual] #status, html.waking[data-visual] #status,
  html.idle[data-visual] #credit, html.waking[data-visual] #credit {
    pointer-events: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three-0.160.0.module.min.js"
  }
}
</script>
</head>
<body>
<canvas id="viz" class="viz"></canvas>
<canvas id="viz-gpu" class="viz"></canvas>
<canvas id="viz-sand" class="viz"></canvas>
<canvas id="viz-reaction" class="viz"></canvas>
<canvas id="viz-trace" class="viz"></canvas>
<canvas id="viz-aurora" class="viz"></canvas>
<canvas id="viz-pool" class="viz"></canvas>
<canvas id="viz-magnet" class="viz"></canvas>
<canvas id="viz-ink" class="viz"></canvas>
<canvas id="viz-ferro" class="viz"></canvas>
<audio controls preload="none" src="/stream"></audio>
<p id="compound">awaiting compound</p>
<p id="caption" hidden></p>
<div id="status">
  <div>on air since 20 May 2026 · <b id="on-air"></b></div>
  <div id="run-line" hidden>this run · <b id="this-run"></b></div>
  <div><span id="listeners-line" hidden><b id="listeners"></b> listening now · </span><span id="visits-line" hidden>visitors <span id="visits"></span></span></div>
  <div><span id="visual-part" hidden><button id="visual-switch" type="button">change visual</button><span class="key"> (v)</span> · <button id="tour-switch" type="button" title="change the visual by itself every five minutes">tour</button><span class="key"> (t)</span></span><span id="watch-part"><button id="watch-switch" type="button">fullscreen</button><span class="key"> (f)</span></span><span id="sleep-part"><button id="sleep-switch" type="button" title="stop the sound after 15, 30, 60 or 90 minutes">sleep timer</button><span class="key"> (s)</span></span></div>
</div>
<div id="credit">Made with love using <a href="https://claude.com/claude-code">Claude Code</a></div>
<script>
  // The day of the first commit. "This run" is how long the current stream
  // has been up; it starts again whenever the station restarts.
  const ON_AIR_SINCE = Date.UTC(2026, 4, 20);
  let clockOffset = 0;       // the server's clock minus this device's, in ms
  let streamStarted = null;  // ms since the epoch, from the server

  const byId = (id) => document.getElementById(id);
  const two = (n) => String(n).padStart(2, '0');
  function elapsed(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const days = Math.floor(s / 86400);
    const clock = two(Math.floor(s / 3600) % 24) + ':' + two(Math.floor(s / 60) % 60) + ':' + two(s % 60);
    return days > 0 ? days + (days === 1 ? ' day ' : ' days ') + clock : clock;
  }
  function tickClocks() {
    const now = Date.now() + clockOffset;
    byId('on-air').textContent = elapsed(now - ON_AIR_SINCE);
    byId('run-line').hidden = streamStarted === null;
    if (streamStarted !== null) byId('this-run').textContent = elapsed(now - streamStarted);
  }
  tickClocks();
  setInterval(tickClocks, 1000);

  function showVisits(count) {
    if (typeof count !== 'number') return;
    byId('visits').innerHTML = String(count).padStart(6, '0')
      .split('').map((d) => '<span>' + d + '</span>').join('');
    byId('visits-line').hidden = false;
  }

  // The cover a phone or a desktop shows next to what is playing: the
  // compound's own spectrum, the peaks the station voices (the same rule as
  // piece.scd), low to high from left to right, a peak's height its
  // strength, in the colours the visuals give them.
  const COVER = 512;
  const COVER_COLOURS = [[255, 71, 31], [243, 255, 104], [56, 255, 102], [73, 255, 255], [46, 102, 255]];
  function coverColour(x) {
    const at = Math.min(1, Math.max(0, x)) * (COVER_COLOURS.length - 1);
    const i = Math.min(COVER_COLOURS.length - 2, Math.floor(at));
    const a = COVER_COLOURS[i];
    const b = COVER_COLOURS[i + 1];
    return 'rgb(' + a.map((v, k) => Math.round(v + (b[k] - v) * (at - i))).join(',') + ')';
  }
  function drawCover(c) {
    const freqs = Array.isArray(c.frequencies) ? c.frequencies : [];
    const amps = Array.isArray(c.amplitudes) ? c.amplitudes : [];
    let peaks = freqs.map((f, i) => ({ f, a: amps[i] })).filter((p) => p.f > 0 && p.a > 0);
    const top = Math.max(0, ...peaks.map((p) => p.a));
    if (!peaks.length) return null;
    peaks = peaks.filter((p) => p.a >= top * 0.01).sort((p, q) => q.a - p.a).slice(0, 32);
    const logs = peaks.map((p) => Math.log(p.f));
    const lo = Math.min(...logs);
    const span = Math.max(...logs) - lo;

    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = COVER;
    const g = canvas.getContext('2d');
    g.fillStyle = '#111';
    g.fillRect(0, 0, COVER, COVER);
    const left = 72;
    const right = COVER - 72;
    const floor = 404;
    const tallest = 296;
    g.fillStyle = '#2a2a2a';
    g.fillRect(left - 24, floor + 14, right - left + 48, 2);
    g.lineCap = 'round';
    g.lineWidth = Math.min(14, Math.max(4, 150 / peaks.length));
    g.shadowBlur = 2 * g.lineWidth;
    // Peaks that lie close together run into one another, as they do in a
    // drawn mass spectrum. The weakest are drawn first, so that a strong
    // peak is not hidden behind its neighbours.
    peaks.reverse().forEach((p) => {
      const x = span > 0 ? (Math.log(p.f) - lo) / span : 0.5;
      const at = left + x * (right - left);
      g.strokeStyle = g.shadowColor = coverColour(x);
      g.beginPath();
      g.moveTo(at, floor);
      g.lineTo(at, floor - Math.max(4, tallest * Math.sqrt(p.a / top)));
      g.stroke();
    });
    return canvas.toDataURL('image/png');
  }

  // What is playing, for where a listener looks once the page is out of
  // sight: the lock screen, the notifications, the media keys' pop-up.
  let announced = null;
  function announce(c) {
    if (!('mediaSession' in navigator) || typeof MediaMetadata !== 'function') return;
    const key = c
      ? [c.name, c.accession, c.n_peaks, c.frequencies && c.frequencies[0]].join('|')
      : '';
    if (key === announced) return;
    announced = key;
    try {
      // The station's icon stands in where there is no compound, and where
      // a browser will not take a picture that is not a file.
      const artwork = [{ src: '/icon-512.png', sizes: '512x512', type: 'image/png' }];
      const cover = c ? drawCover(c) : null;
      if (cover) artwork.unshift({ src: cover, sizes: COVER + 'x' + COVER, type: 'image/png' });
      navigator.mediaSession.metadata = new MediaMetadata(c ? {
        title: c.name,
        artist: 'generative-station',
        album: c.n_peaks + (c.n_peaks === 1 ? ' peak · ' : ' peaks · ') + c.algorithm,
        artwork,
      } : { title: 'generative-station', artwork });
    } catch (e) {}
  }
  announce(null);

  // One request carries everything the page shows; the visual reads the
  // compound's peaks from window.stationStats.
  async function updateStats() {
    try {
      const r = await fetch('/stats', { cache: 'no-store' });
      if (!r.ok) return;
      const d = await r.json();
      window.stationStats = d;
      clockOffset = d.now * 1000 - Date.now();
      streamStarted = typeof d.stream_started === 'number' ? d.stream_started * 1000 : null;
      const c = d.compound;
      const playing = c
        ? c.name + ' — ' + c.n_peaks + ' peaks · ' + c.algorithm
        : 'awaiting compound';
      if (byId('compound').textContent !== playing) {
        byId('compound').textContent = playing;
        stir(); // someone watching in fullscreen is shown the new name
      }
      announce(c);
      byId('listeners-line').hidden = typeof d.listeners !== 'number';
      if (typeof d.listeners === 'number') byId('listeners').textContent = d.listeners;
      showVisits(d.visits);
      tickClocks();
    } catch (e) {}
  }
  // The visual waits for the first answer, so that it opens on the
  // compound and not on the figure it draws while there is none.
  window.stationStatsReady = updateStats();
  setInterval(updateStats, 10000);

  // Count this browser as a visit, at most once every twelve hours.
  try {
    const last = Number(localStorage.getItem('gs-visit') || 0);
    if (Date.now() - last > 12 * 3600 * 1000) {
      fetch('/visit', { method: 'POST' })
        .then((r) => (r.ok ? r.json() : null))
        .then((d) => {
          if (!d) return;
          localStorage.setItem('gs-visit', String(Date.now()));
          showVisits(d.visits);
        })
        .catch(() => {});
    }
  } catch (e) {}

  // The stream ends whenever the station or Icecast restarts. Reconnect
  // rather than leave a dead player, but only for someone who was listening.
  const player = document.querySelector('audio');
  let listening = false;
  let retryTimer = null;
  let pausedAt = null; // when the listener paused, until the sound is back
  let joinedAt = 0;    // when the page last connected to the stream itself
  player.addEventListener('playing', () => {
    listening = true;
    pausedAt = null;
  });
  player.addEventListener('pause', () => {
    // Only a pause on a healthy stream is the listener's own. The stream
    // ending or failing also pauses the element.
    if (!player.ended && !player.error && player.readyState > 2) {
      listening = false;
      pausedAt = Date.now();
    }
  });
  function reconnect() {
    if (!listening || retryTimer) return;
    retryTimer = setTimeout(() => {
      retryTimer = null;
      joinedAt = Date.now();
      player.load();
      player.play().catch(reconnect);
    }, 3000);
  }
  player.addEventListener('ended', reconnect);
  player.addEventListener('error', reconnect);

  // This is a station, so play means what is on now. A browser left to
  // itself keeps what it was sent while paused and carries on from there:
  // the sound is then as far behind the name and the picture as the pause
  // was long, and after a long pause it runs out, because Icecast has
  // dropped a listener that stopped reading, and is cut off until the page
  // has reconnected. So play after more than a short pause connects afresh.
  // For the same reason the player does not preload: a browser that does
  // connects when the page opens, and play pressed later starts from then.
  // Connecting only on play also means that "listening now" counts
  // listeners and not open pages.
  const STALE_AFTER = 10000;
  let mayRejoin = true;
  player.addEventListener('play', () => {
    if (pausedAt === null || !mayRejoin) return;
    // Connecting sets off a "play" of its own, which must not connect again.
    if (Date.now() - Math.max(pausedAt, joinedAt) < STALE_AFTER) return;
    listening = true; // so that a connection that fails is tried again
    joinedAt = Date.now();
    player.load();
    player.play().catch((e) => {
      // A browser that will not let the page start the sound is left to
      // resume in its own way from now on; the next press is the listener's.
      if (!e || e.name !== 'NotAllowedError') return;
      mayRejoin = false;
      listening = false;
      pausedAt = null;
    });
  });

  // A connection can also die without a word. A phone that is out of signal
  // for longer than Icecast will wait is dropped by it and never hears so,
  // and the browser then waits for good on a connection that nothing will
  // come down: no error, no end, the player still showing that it plays,
  // and pause and play only go back to the same dead connection. So when
  // the sound should be moving on, has not for a while, and it is the
  // stream that the player is waiting for, connect afresh. An attempt that
  // brings nothing is followed by one that is given longer, so that a slow
  // connection is not cut off again and again before it can start.
  const STUCK_AFTER = 10000;
  const STUCK_LONGEST = 30000;
  let patience = STUCK_AFTER;
  let movedAt = Date.now(); // when the sound last moved on, or did not have to
  let movedTo = -1;
  let stuckFor = 0;         // looks in a row that found it where it was
  setInterval(() => {
    const now = Date.now();
    const at = player.currentTime;
    const moved = at > movedTo;
    movedTo = at;
    if (moved) patience = STUCK_AFTER;
    // A player that has sound to play and stands still is held up by
    // something else (the device's sound, say), which a new connection
    // would not mend.
    const starved = player.readyState < 3;
    if (moved || !starved || !listening || player.paused || retryTimer) {
      movedAt = now;
      stuckFor = 0;
      return;
    }
    // Two looks at least: the first after a device has slept, or a hidden
    // page has been held back, says only that this was not running.
    stuckFor += 1;
    if (stuckFor < 2 || now - movedAt < patience) return;
    movedAt = now;
    stuckFor = 0;
    patience = Math.min(2 * patience, STUCK_LONGEST);
    joinedAt = now;
    player.load();
    player.play().catch((e) => {
      // Where the page may not start the sound itself, the player is left
      // stopped and showing it: the next press is the listener's, and it
      // connects afresh. A start that was called off, by a pause or by
      // another connection, is left to whatever called it off.
      if (e && e.name === 'NotAllowedError') listening = false;
      else if (!e || e.name !== 'AbortError') reconnect();
    });
  }, 1000);

  // The station does not end, so someone who falls asleep to it is played
  // to all night. The timer is how it is asked to stop by itself: each
  // press asks for longer, 15 minutes, then 30, 60 and 90, and the one
  // after that calls it off, as the sleep button of a clock radio does. The
  // button counts down what is left. The sound is turned down over the last
  // seconds, where a page is allowed to turn it (an iPhone keeps the volume
  // to its own buttons, and there it simply stops), then paused like a
  // listener's own pause: the screen is let go to sleep too, and the next
  // play is what is on then.
  const SLEEP_MINUTES = [15, 30, 60, 90];
  const SLEEP_FADE = 20000;
  const sleepSwitch = byId('sleep-switch');
  let sleepStep = -1;    // which of SLEEP_MINUTES was asked for, if any
  let sleepAt = null;    // when the sound is to stop
  let sleepTimer = null;
  let fadedFrom = null;  // the listener's volume, while it is turned down
  function showSleep() {
    const s = sleepAt === null ? 0 : Math.max(0, Math.ceil((sleepAt - Date.now()) / 1000));
    const says = sleepAt === null ? 'sleep timer' : 'sleep ' + Math.floor(s / 60) + ':' + two(s % 60);
    if (sleepSwitch.textContent !== says) sleepSwitch.textContent = says;
  }
  function endFade() {
    if (fadedFrom === null) return;
    player.volume = fadedFrom;
    fadedFrom = null;
  }
  function tickSleep() {
    if (sleepAt === null) return;
    const left = sleepAt - Date.now();
    if (left > 0) {
      if (left >= SLEEP_FADE || player.paused) {
        endFade();
      } else {
        if (fadedFrom === null) fadedFrom = player.volume;
        // Slowly at first, as an ear hears it.
        try { player.volume = fadedFrom * Math.pow(left / SLEEP_FADE, 2); } catch (e) {}
      }
      showSleep();
      return;
    }
    setSleep(-1, true);
    // Nothing the page does by itself may bring the sound back: not a
    // reconnection that is waiting its turn because the stream has just
    // ended (which leaves the player paused already), nor one set off by
    // an error that arrives later.
    if (listening || !player.paused) pausedAt = Date.now();
    listening = false;
    clearTimeout(retryTimer);
    retryTimer = null;
    if (!player.paused) player.pause();
  }
  function setSleep(step, asleep) {
    sleepStep = step;
    sleepAt = step < 0 ? null : Date.now() + SLEEP_MINUTES[step] * 60000;
    clearInterval(sleepTimer);
    sleepTimer = sleepAt === null ? null : setInterval(tickSleep, 200);
    // The volume is the listener's again at once, except where the sound
    // has just been turned all the way down to be stopped: there it is
    // given back once the sound has stopped, so that it is not heard.
    if (asleep) setTimeout(endFade, 500);
    else endFade();
    showSleep();
  }
  function stepSleep() {
    setSleep(sleepStep + 1 < SLEEP_MINUTES.length ? sleepStep + 1 : -1);
  }
  // A page that is out of sight may have its timers held back. The player
  // tells its own time for as long as it plays, so the timer is looked at
  // then too, and the sound does not run on past it.
  player.addEventListener('timeupdate', tickSleep);
  sleepSwitch.addEventListener('click', stepSleep);
  window.addEventListener('keydown', (e) => {
    if (e.key === 's' && !e.ctrlKey && !e.metaKey && !e.altKey) stepSleep();
  });

  // Watching is the picture with nothing in front of it. Where a page can
  // be put in fullscreen that is what watching is, by the f key or by the
  // button, which is all a phone or a tablet has. An iPhone cannot put a
  // page in fullscreen: there the same button hides the words and leaves
  // the browser as it is, and everything else about watching is the same.
  const root = document.documentElement;
  const canFullscreen = Boolean(document.fullscreenEnabled && root.requestFullscreen);
  const watchSwitch = byId('watch-switch');
  let wordsHidden = false; // watching, where there is no fullscreen
  const watching = () => Boolean(document.fullscreenElement) || wordsHidden;
  function toggleWatching() {
    if (canFullscreen) {
      if (document.fullscreenElement) document.exitFullscreen();
      else root.requestFullscreen().catch(() => {});
      return;
    }
    // Nothing to watch yet: the words stay.
    if (!wordsHidden && !root.dataset.visual) return;
    wordsHidden = !wordsHidden;
    // When the words next come back, the button is how they are kept.
    watchSwitch.textContent = wordsHidden ? 'keep words' : 'hide words';
    stir();
    // The words were asked to go, so they go now and not in a few seconds.
    if (wordsHidden) settle();
    holdScreen();
  }
  if (!canFullscreen) {
    watchSwitch.textContent = 'hide words';
    byId('watch-part').classList.add('words-only');
  }
  watchSwitch.addEventListener('click', toggleWatching);
  window.addEventListener('keydown', (e) => {
    // Leave the browser its own shortcuts: Ctrl+F and Cmd+F are find.
    if (e.key !== 'f' || e.ctrlKey || e.metaKey || e.altKey) return;
    e.preventDefault();
    toggleWatching();
  });

  // While watching, the words leave the picture once nothing has been
  // touched for a while (the style sheet says how), and anything touched
  // brings them back.
  const IDLE_AFTER = 4000;
  let idleTimer = null;
  function settle() {
    clearTimeout(idleTimer);
    idleTimer = null;
    root.classList.add('idle');
  }
  function stir() {
    if (root.classList.contains('idle')) {
      root.classList.remove('idle');
      root.classList.add('waking');
      setTimeout(() => root.classList.remove('waking'), 400);
    }
    clearTimeout(idleTimer);
    idleTimer = watching() ? setTimeout(settle, IDLE_AFTER) : null;
  }
  // A browser also reports a move when the page changes under a pointer
  // that is lying still, which the fade itself would set off.
  let pointerAt = '';
  window.addEventListener('pointermove', (e) => {
    const at = e.screenX + ',' + e.screenY;
    if (at === pointerAt) return;
    pointerAt = at;
    stir();
  });
  window.addEventListener('pointerdown', stir);
  window.addEventListener('keydown', stir);

  // Nobody touches a screen they are watching, so it would dim and lock in
  // the middle of the picture. While the station plays and is watched the
  // screen is asked to stay awake, and let go again as soon as either ends.
  let screenLock = null;
  let lockAsked = false;
  async function holdScreen() {
    if (!navigator.wakeLock || lockAsked) return;
    const wanted = watching() && !player.paused
      && document.visibilityState === 'visible';
    if (wanted && !screenLock) {
      lockAsked = true;
      try {
        const lock = await navigator.wakeLock.request('screen');
        // The browser lets go by itself when the page is hidden.
        lock.addEventListener('release', () => { if (screenLock === lock) screenLock = null; });
        screenLock = lock;
      } catch (e) {}
      lockAsked = false;
      if (screenLock) holdScreen(); // in case it stopped being wanted meanwhile
    } else if (!wanted && screenLock) {
      const lock = screenLock;
      screenLock = null;
      lock.release().catch(() => {});
    }
  }
  ['playing', 'pause', 'ended', 'error', 'emptied'].forEach((name) => player.addEventListener(name, holdScreen));
  document.addEventListener('visibilitychange', holdScreen);
  document.addEventListener('fullscreenchange', () => { stir(); holdScreen(); });
</script>
<script type="module">
  // Ten visuals. "bloom", "sand", "reaction", "trace", "aurora", "pool",
  // "magnet", "ink" and "ferro" need WebGPU; "rings" runs everywhere and is all a
  // browser without WebGPU gets. The WebGPU ones draw the compound whether
  // or not there is sound, so they are there when the page opens, and
  // follow the stream from the first play on. "rings" draws the sound and
  // nothing else, so it waits for the first play.
  const audio = document.querySelector('audio');
  const visuals = {
    bloom: { canvas: document.getElementById('viz-gpu'), module: '/viz-bloom.js' },
    sand: { canvas: document.getElementById('viz-sand'), module: '/viz-sand.js' },
    reaction: { canvas: document.getElementById('viz-reaction'), module: '/viz-reaction.js' },
    trace: { canvas: document.getElementById('viz-trace'), module: '/viz-trace.js' },
    aurora: { canvas: document.getElementById('viz-aurora'), module: '/viz-aurora.js' },
    pool: { canvas: document.getElementById('viz-pool'), module: '/viz-pool.js' },
    magnet: { canvas: document.getElementById('viz-magnet'), module: '/viz-magnet.js' },
    ink: { canvas: document.getElementById('viz-ink'), module: '/viz-ink.js' },
    ferro: { canvas: document.getElementById('viz-ferro'), module: '/viz-ferro.js' },
    rings: { canvas: document.getElementById('viz'), module: '/viz-rings.js' },
  };
  // The order the switch steps through.
  const order = (navigator.gpu ? ['bloom', 'sand', 'reaction', 'trace', 'aurora', 'pool', 'magnet', 'ink', 'ferro'] : []).concat(['rings']);
  let started = false; // the audio graph, with the first play
  let analyser = null;
  let current = null;
  let handle = null;
  let switching = false;
  // What each picture is of. The pictures are drawn from the compound, and
  // nothing in them says so: a ring, a ray or a swing of the pen is one of
  // the peaks counted beside the compound's name. So the page says it, under
  // that name, and with it what the visual is called.
  const captions = {
    bloom: 'each peak is a ring of particles, wider and bluer the higher the peak',
    sand: 'each peak shakes a plate of sand, and the sand gathers where the plate is still',
    reaction: 'the peaks decide what grows in a dish: spots, stripes or restless shapes',
    trace: 'each peak is a pendulum swinging one pen, faster the higher the peak',
    aurora: 'each peak is a ray of light, low to high across the sky, taller the stronger',
    pool: 'each peak is a ripple on a pool, finer the higher the peak, and this is their light on its floor',
    magnet: 'each peak is a beam of ions that a magnet bends onto a plate, wider the higher the peak',
    ink: 'each peak lets ink of its own colour into water, more of it the stronger the peak',
    ferro: 'each peak is a magnet under a dish of black fluid, which stands up in spikes over it',
    rings: 'the sound itself, a bar for each part of it, red for low to blue for high',
  };
  const caption = document.getElementById('caption');
  // The page reads from the root element whether anything is being drawn.
  function nowShowing(name) {
    current = name;
    if (name) document.documentElement.dataset.visual = name;
    else delete document.documentElement.dataset.visual;
    caption.hidden = !captions[name];
    if (captions[name]) {
      const called = document.createElement('b');
      called.textContent = name;
      caption.textContent = '';
      caption.append(called, ' · ' + captions[name]);
    }
  }

  // What a visual is given to listen with. A browser only allows the audio
  // graph after a gesture, so the analyser itself does not exist before the
  // first play; until then this hears silence. It always counts its bins
  // over 0 to 24 kHz, whatever rate the device turns out to play at.
  const BINS = 2048;
  const RATE = 48000;
  let heard = null;
  const ears = {
    frequencyBinCount: BINS,
    context: { sampleRate: RATE },
    getByteFrequencyData(into) {
      if (!analyser) return;
      const rate = analyser.context.sampleRate;
      if (rate === RATE && into.length === analyser.frequencyBinCount) {
        analyser.getByteFrequencyData(into);
        return;
      }
      if (!heard) heard = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(heard);
      for (let i = 0; i < into.length; i++) into[i] = heard[Math.round((i * RATE) / rate)] || 0;
    },
  };

  function remembered() {
    try { return localStorage.getItem('gs-visual'); } catch (e) { return null; }
  }
  // The visual this browser was left on, or the first.
  const first = order.includes(remembered()) ? remembered() : order[0];

  async function show(name) {
    if (switching) return;
    switching = true;
    try {
      if (handle) {
        handle.stop();
        handle = null;
        visuals[current].canvas.style.opacity = '0';
        // The page is not told that nothing is drawn: the next picture is
        // on its way, and for someone watching the words would come back
        // into it for the moment between the two.
        current = null;
      }
      const visual = visuals[name];
      const { start } = await import(visual.module);
      handle = await start(visual.canvas, ears, {
        getCompound: () => (window.stationStats && window.stationStats.compound) || null,
        onLost: (info) => {
          console.warn('the "' + name + '" visual lost its GPU device:', info && info.message);
          handle = null;
          nowShowing(null);
          visual.canvas.style.opacity = '0';
          show('rings');
        },
      });
      nowShowing(name);
      requestAnimationFrame(() => { visual.canvas.style.opacity = '1'; });
    } catch (e) {
      console.warn('the "' + name + '" visual could not start:', e);
      nowShowing(null);
      // Not offered again, or the switch would keep coming back to it.
      if (name !== 'rings' && order.includes(name)) order.splice(order.indexOf(name), 1);
      switching = false;
      if (name !== 'rings') return show('rings');
    } finally {
      switching = false;
    }
  }

  // The visual after the one that is showing, among those given, if there
  // is another.
  function after(among) {
    if (!among.length) return null;
    const next = among[(among.indexOf(current || first) + 1) % among.length];
    return next === current ? null : next;
  }
  function change(next) {
    if (switching || !next) return;
    try { localStorage.setItem('gs-visual', next); } catch (e) {}
    tourLeft = TOUR_EVERY; // a visual chosen by hand is given its full time too
    showTour();
    return show(next);
  }
  const drawn = () => order.filter((name) => name !== 'rings');
  function switchVisual() {
    // Before the first play there is nothing for "rings" to draw.
    change(after(analyser ? order : drawn()));
  }

  // There are more pictures than anyone finds by pressing the switch, and
  // someone watching does not press anything: the station on a screen
  // across the room stays on the picture it was left on. The tour changes
  // it for them. While it is on, the page moves to the next visual by
  // itself every five minutes, in the order the switch steps through, and
  // the button counts down to the next. It goes round the visuals that
  // draw the compound and passes over "rings", which draws the sound and
  // would be an empty screen for as long as the station is paused. Only
  // time the picture is there to be seen counts, so a page left in the
  // background comes back to the visual it had. The old picture is faded
  // out while it still moves, which a change made by hand does not wait
  // for. The words stay away: someone watching asked for the picture, and
  // a move or a tap says what it now is. It is remembered like the visual
  // itself.
  const TOUR_EVERY = 5 * 60000;
  const TOUR_FADE = 1800; // what the style sheet gives a canvas to fade
  const tourSwitch = document.getElementById('tour-switch');
  let touring = false;
  let tourLeft = TOUR_EVERY; // of looking, until the next visual
  let tourLooked = 0;        // when the tour last looked at the time
  let tourTimer = null;
  let tourMoving = false;    // the old picture is fading out
  function showTour() {
    const s = Math.max(0, Math.ceil(tourLeft / 1000));
    const says = touring
      ? 'next in ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0')
      : 'tour';
    if (tourSwitch.textContent !== says) tourSwitch.textContent = says;
  }
  async function tourOn() {
    const from = current;
    tourMoving = true;
    try {
      visuals[from].canvas.style.opacity = '0';
      await new Promise((resolve) => setTimeout(resolve, TOUR_FADE));
      // Unless it was called off meanwhile, or the picture changed by hand.
      if (touring && current === from) await change(after(drawn()));
    } finally {
      tourMoving = false;
      // Whatever came of it, a picture that is still there is seen again.
      if (current === from && handle) visuals[from].canvas.style.opacity = '1';
    }
  }
  function tickTour() {
    const now = performance.now();
    const looked = Math.min(now - tourLooked, 1500);
    tourLooked = now;
    if (document.hidden || !current || switching || tourMoving) return;
    tourLeft -= looked;
    if (tourLeft <= 0) {
      tourLeft = TOUR_EVERY;
      // Where there is no other visual to show, this one stays.
      if (after(drawn())) tourOn();
    }
    showTour();
  }
  function setTour(on, remember) {
    touring = on;
    tourLeft = TOUR_EVERY;
    tourLooked = performance.now();
    clearInterval(tourTimer);
    tourTimer = on ? setInterval(tickTour, 500) : null;
    if (remember) {
      try {
        if (on) localStorage.setItem('gs-tour', '1');
        else localStorage.removeItem('gs-tour');
      } catch (e) {}
    }
    showTour();
  }
  try { if (navigator.gpu && localStorage.getItem('gs-tour')) setTour(true, false); } catch (e) {}

  // The picture is there before the sound, except for someone who has asked
  // their device for less motion: they get it with the first play, as
  // everyone did before.
  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (first !== 'rings' && !still) {
    Promise.race([
      window.stationStatsReady,
      new Promise((resolve) => setTimeout(resolve, 3000)),
    ]).then(() => { if (!current) show(first); });
  }

  audio.addEventListener('play', async () => {
    if (started) return;
    started = true;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    const source = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2 * BINS;
    analyser.smoothingTimeConstant = 0.7;
    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    if (!current) await show(order.includes(first) ? first : 'rings');
  });

  // Only offer the switch where there is something to switch to.
  document.getElementById('visual-part').hidden = !navigator.gpu;
  document.getElementById('visual-switch').addEventListener('click', switchVisual);
  tourSwitch.addEventListener('click', () => setTour(!touring, true));
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || !navigator.gpu) return;
    if (e.key === 'v') switchVisual();
    if (e.key === 't') setTour(!touring, true);
  });
</script>
