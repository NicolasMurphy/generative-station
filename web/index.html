<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>generative-station</title>
<style>
  body {
    background: #111;
    color: #ddd;
    font-family: monospace;
    padding: 1.5rem;
  }
</style>
</head>
<body>
<h1>generative-station</h1>
<audio controls src="/stream"></audio>
<p id="compound">awaiting compound</p>
<script>
  async function updateCompound() {
    try {
      const r = await fetch('/current', { cache: 'no-store' });
      if (r.status === 204) {
        document.getElementById('compound').textContent = 'awaiting compound';
        return;
      }
      if (!r.ok) return;
      const d = await r.json();
      document.getElementById('compound').textContent =
        d.name + ' — ' + d.n_peaks + ' peaks · ' + d.algorithm;
    } catch (e) {}
  }
  updateCompound();
  setInterval(updateCompound, 10000);
</script>
</body>
</html>
